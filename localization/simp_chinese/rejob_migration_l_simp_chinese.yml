l_simp_chinese:
 rejob_migration_decision:0 "迁移失业人口至首都"
 rejob_migration_decision_desc:0 "打开迁移批次选择。估算仅按非首都州总人口与失业率计算，不代表精确的合格失业人口数。"
 rejob_migration.1.t:0 "再就业迁移中心"
 rejob_migration.1.desc:0 "选择将符合条件的非首都州失业人口迁往首都。只有失业且非 delicious 类型的人口会被处理。数量门槛使用非首都州总人口 × 失业率的近似估算；实际合格人数可能更少。费用按脚本逐组计算的迁移量每人收取 1 个国库单位；游戏效果不返回迁移后的实数，因此引擎取整可能造成少量计费差异。"
 rejob_migration.1.a:0 "迁移 100 万人"
