l_simp_chinese:
 building_rejob_unemployment_center:0 "再就业中心"
 building_rejob_unemployment_center_desc:0 "专门面向失业人口开放的就业中心。岗位由生产方式决定，只招募符合条件的标准职业人口，不设不可接触者岗位。"
 building_rejob_unemployment_center_lens_option:0 "扩建$building_rejob_unemployment_center$"
 # ★ 建筑组名的 loc key = 组名本身（不是 building_group_<组名>）。
 #   原先误写成 building_group_rejob_unemployment_center，
 #   而那是「修正类型」的命名空间，导致建筑面板右上角显示原始 ID。
 #   修正后的条目在 rejob_mortality_l_simp_chinese.yml 中统一维护。
 #   （已删除：building_group_rejob_unemployment_center / _desc）
 # ★ 2026-10-14 R1：PMG 键加了 pmg_ 前缀，故 loc key 同步改名。
 #   PMG 的 loc key = 组名本身（不带 pmg_ 前缀时的原名），
 #   加前缀后必须一并改，否则建筑面板上的组名会退回显示原始 ID。
